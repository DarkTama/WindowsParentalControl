name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.2.0)"
        required: false
        default: "v1.2.0"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress

      - name: Build installer
        shell: pwsh
        run: .\build.ps1

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          PREV_TAG=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || echo "")

          echo "## What's Changed" > notes.md
          echo "" >> notes.md

          if [ -n "$PREV_TAG" ]; then
            git log "$PREV_TAG..$TAG" --pretty=format:"* %s (%h)" --no-merges >> notes.md
            echo "" >> notes.md
            echo "" >> notes.md
            echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/$PREV_TAG...$TAG" >> notes.md
          else
            git log "$TAG" -n 30 --pretty=format:"* %s (%h)" --no-merges >> notes.md
          fi

          gh release create "$TAG" \
            installer/Output/ParentalControlSetup.exe \
            --title "$TAG" \
            --notes-file notes.md
