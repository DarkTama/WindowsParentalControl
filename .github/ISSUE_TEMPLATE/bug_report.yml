name: "🐛 Bug Report"
description: "File a bug report to help us improve WindowsParentalControl"
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please ensure you are running the latest version of WindowsParentalControl.
  - type: input
    id: version
    attributes:
      label: WindowsParentalControl Version
      description: What version or commit hash are you running? (e.g. v2.0.0 or 65e9141)
      placeholder: v2.0.0
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component Affected
      description: Which part of the system is experiencing the issue?
      options:
        - Background Service (ParentalControl.Service)
        - Desktop Admin UI (ParentalControl.Admin)
        - Session Agent / Floating Widget (ParentalControl.Agent)
        - Web Admin Portal (/admin)
        - User Request Portal (/request)
        - Telegram Bot Integration
        - Installer / Setup (ParentalControlSetup.exe)
        - Other
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      description: What version of Windows are you using?
      options:
        - Windows 11 (23H2 / 24H2)
        - Windows 11 (21H2 / 22H2)
        - Windows 10 (22H2)
        - Windows 10 (earlier)
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to Reproduce
      description: Detailed steps explaining how to reproduce the issue.
      placeholder: |
        1. Log in as restricted user '...'
        2. Wait until curfew / trigger action '...'
        3. See unexpected behavior / error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs Actual Behavior
      description: What did you expect to happen versus what actually happened?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / Error Output
      description: Paste relevant logs from C:\ProgramData\ParentalControl\logs or Event Viewer (DO NOT paste private bot tokens, chat IDs, or TOTP secrets!).
      render: shell
